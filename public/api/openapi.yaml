openapi: 3.1.0
info:
  title: MyPayTag Public API
  version: 0.1.0
  summary: Public resolver contracts for sending apps and receiving apps.
  description: |
    MyPayTag lets sending apps resolve a user paytag into a one-time payment
    intent, while receiving apps register supported routes and create dynamic
    provider intents only after selection.

    This public OpenAPI document describes integration-facing contracts only.
    It does not expose private resolver storage, deployment wiring, audit
    internals, admin APIs, service-role behavior, or provider credentials.
  contact:
    name: MyPayTag
    url: https://mypaytag.com
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:54321/functions/v1
    description: Local Supabase functions
  - url: https://staging-api.mypaytag.com/functions/v1
    description: Staging API
  - url: https://api.mypaytag.com/functions/v1
    description: Production API
tags:
  - name: Health
    description: Availability checks.
  - name: Resolve
    description: Sending-app payment resolution.
  - name: Routes
    description: Receiving-app route registration.
  - name: Hosted Actions
    description: Browser-safe action hydration and completion.
  - name: Notifications
    description: Cubid comms notification event payloads.
  - name: Portal
    description: Authenticated user portal preferences and history.
security:
  - MyPayTagSignature: []
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check API availability.
      security: []
      responses:
        "200":
          description: API is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    service: mypaytag-api
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /resolve:
    post:
      tags:
        - Resolve
      operationId: resolvePayment
      summary: Resolve a paytag into a payment intent or safe next action.
      description: |
        Sending apps submit a paytag or opaque paytag reference, supported payment
        paths, amount, purpose, and reconciliation reference. The response is a
        resolved one-time MyPayTag intent, a hosted action, or a public safe
        status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
            examples:
              baseUsdcPayout:
                summary: Base USDC payout
                value:
                  recipient:
                    identifierType: paytag
                    identifier: abd123@cubid.mypaytag
                  supportedPaths:
                    - chain: base
                      network: mainnet
                      asset: USDC
                  amount:
                    value: "25.00"
                    currency: USDC
                  purpose: payout
                  intentMode: one_time
                  payingDappReference: sender:payout_987
      responses:
        "200":
          description: Public resolver outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResponse"
              examples:
                resolved:
                  summary: Resolved payment intent
                  value:
                    status: resolved
                    intent:
                      id: mpt_pi_123
                      schema: mypaytag.intent.v1
                      status: ready
                      modality: provider_intent
                      recipient:
                        identifierType: paytag
                        identifierHash: sha256:example
                      selectedRoute:
                        payToDappId: example-wallet
                        chain: base
                        network: mainnet
                        asset: USDC
                      amount:
                        value: "25.00"
                        currency: USDC
                      expiresAt: "2026-06-24T20:00:00Z"
                      singleUse: true
                      paymentInstruction:
                        type: provider_json
                        provider: example-wallet
                        payload:
                          providerIntentId: provider_pi_456
                          resolverReference: mpt_req_123
                          payingDappId: sender
                          payingDappReference: sender:payout_987
                          chain: base
                          network: mainnet
                          asset: USDC
                          destination:
                            kind: blockchain_address
                            recipientAddress: "0xabc0000000000000000000000000000000000000"
                          amount: "25.00"
                          purpose: payout
                          reference: example-wallet:provider_pi_456
                          expiresAt: "2026-06-24T20:00:00Z"
                      references:
                        resolverReference: mpt_pi_123
                        providerReference: provider_pi_456
                        payingDappReference: sender:payout_987
                actionRequired:
                  summary: User route selection required
                  value:
                    status: user_action_required
                    action:
                      type: route_selection
                      url: https://mypaytag.com/actions/route-selection/mpt_act_123
                      expiresAt: "2026-06-24T20:00:00Z"
                noRoute:
                  summary: Safe no-route response
                  value:
                    status: no_route
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /payto-routes:
    get:
      tags:
        - Routes
      operationId: listPayToRoutes
      summary: List receiving-app routes scoped to the authenticated app.
      responses:
        "200":
          description: Scoped route list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteListResponse"
              examples:
                routes:
                  value:
                    status: resolved
                    routes:
                      - id: mpt_route_123
                        payToDappId: example-wallet
                        chain: base
                        network: mainnet
                        asset: USDC
                        state: active
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Routes
      operationId: createPayToRoutes
      summary: Register supported receive routes for a receiving app.
      description: |
        Receiving apps register route availability for a signed-in user.
        Registration must not include wallet addresses, accounts, memos,
        payment links, or chain-specific payment instructions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRegistrationRequest"
            examples:
              smartrustBaseUsdc:
                summary: Register Base USDC support
                value:
                  recipient:
                    identifierType: paytag
                    identifier: abd123@cubid.mypaytag
                  payToDappId: example-wallet
                  supportedRoutes:
                    - chain: base
                      network: mainnet
                      asset: USDC
                  authorizationToken: mpt_auth_123
      responses:
        "200":
          description: Route registration outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteRegistrationResponse"
              examples:
                registered:
                  value:
                    status: resolved
                    routes:
                      - id: mpt_route_123
                        payToDappId: example-wallet
                        chain: base
                        network: mainnet
                        asset: USDC
                        state: active
                routeSelectionRequired:
                  value:
                    status: user_action_required
                    action:
                      type: route_selection
                      url: https://mypaytag.com/actions/route-selection/mpt_act_123
                      expiresAt: "2026-06-24T20:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /payto-routes/{routeId}:
    get:
      tags:
        - Routes
      operationId: getPayToRoute
      summary: Read a receiving-app route scoped to the authenticated app.
      parameters:
        - $ref: "#/components/parameters/RouteId"
      responses:
        "200":
          description: Route details scoped to the authenticated app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteReadResponse"
              examples:
                route:
                  value:
                    status: resolved
                    route:
                      id: mpt_route_123
                      payToDappId: example-wallet
                      chain: base
                      network: mainnet
                      asset: USDC
                      state: active
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Routes
      operationId: updatePayToRoute
      summary: Update a receiving-app route.
      parameters:
        - $ref: "#/components/parameters/RouteId"
      requestBody:
        required: true
        content:
          application/json:
              schema:
                $ref: "#/components/schemas/RouteUpdateRequest"
              examples:
                disableRoute:
                  value:
                    state: disabled
      responses:
        "200":
          description: Updated route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteReadResponse"
              examples:
                route:
                  value:
                    status: resolved
                    route:
                      id: mpt_route_123
                      payToDappId: example-wallet
                      chain: base
                      network: mainnet
                      asset: USDC
                      state: disabled
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Routes
      operationId: deletePayToRoute
      summary: Revoke a receiving-app route.
      parameters:
        - $ref: "#/components/parameters/RouteId"
      responses:
        "200":
          description: Route revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteDeleteResponse"
              examples:
                revoked:
                  value:
                    status: revoked
                    routeId: mpt_route_123
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /hosted-actions/{actionId}:
    get:
      tags:
        - Hosted Actions
      operationId: getHostedAction
      summary: Hydrate a browser-safe hosted action view model.
      description: |
        Hosted action URLs are opaque and short-lived. Details are hydrated only
        after action validation and signed-in user context checks.
      parameters:
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: Browser-safe hosted action view model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedActionView"
              examples:
                readyRouteSelection:
                  value:
                    status: ready
                    actionId: mpt_act_789
                    actionType: route_selection
                    expiresAt: "2026-06-24T20:00:00Z"
                    options:
                      - optionId: mpt_route_option_123
                        chain: base
                        network: mainnet
                        asset: USDC
                        payToDappId: smartrust-wallet
                        displayName: SmarTrust Wallet - Base USDC
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - Hosted Actions
      operationId: completeHostedAction
      summary: Complete a hosted action decision.
      parameters:
        - $ref: "#/components/parameters/ActionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostedActionDecision"
            examples:
              selectRoute:
                value:
                  decision: select_route
                  selectedOptionId: mpt_route_option_123
      responses:
        "200":
          description: Completion state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedActionCompletion"
              examples:
                selectedRoute:
                  value:
                    status: selected_route
                    actionId: mpt_act_789
                    selectedOptionId: mpt_route_option_123
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/preferences:
    get:
      tags:
        - Portal
      operationId: getPortalPreferences
      summary: List authenticated user receive-route preferences.
      security:
        - CubidUserBearer: []
      responses:
        "200":
          description: User-scoped receive-route preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalPreferencesResponse"
              examples:
                preferences:
                  value:
                    schema: mypaytag.portal.preferences.v1
                    user:
                      maskedDisplay: a***@cubid.mypaytag
                    groups:
                      - paytagRef: paytag_ref_abc
                        maskedDisplay: a***@cubid.mypaytag
                        chain: base
                        network: mainnet
                        asset: USDC
                        payingDapp:
                          id: chaincrew
                          displayName: ChainCrew
                        routes:
                          - routeId: mpt_route_123
                            payToDappId: smartrust-wallet
                            payToDappName: SmarTrust Wallet
                            appUrl: https://wallet.smartrust.example
                            priority: 0
                            isDefault: true
                            state: active
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags:
        - Portal
      operationId: updatePortalPreferences
      summary: Reorder authenticated user receive-route preferences.
      security:
        - CubidUserBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalPreferencesUpdateRequest"
            examples:
              reorder:
                value:
                  schema: mypaytag.portal.preferences.update.v1
                  group:
                    paytagRef: paytag_ref_abc
                    chain: base
                    network: mainnet
                    asset: USDC
                    payingDappId: chaincrew
                  orderedRouteIds:
                    - mpt_route_456
                    - mpt_route_123
      responses:
        "200":
          description: Updated user-scoped preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalPreferencesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /portal/history:
    get:
      tags:
        - Portal
      operationId: getPortalHistory
      summary: List authenticated user questions, answers, quotes, intents, and receipts.
      security:
        - CubidUserBearer: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - questions
              - answers
              - quotes
              - intents
              - receipts
              - all
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum:
              - paying_dapp
              - payto_dapp
              - token
              - chain
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: User-scoped history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalHistoryResponse"
              examples:
                history:
                  value:
                    schema: mypaytag.portal.history.v1
                    user:
                      maskedDisplay: a***@cubid.mypaytag
                    items:
                      - kind: question
                        id: mpt_req_123
                        createdAt: "2026-06-24T19:58:00Z"
                        payingDapp:
                          id: chaincrew
                          displayName: ChainCrew
                          appUrl: https://chaincrew.example
                        paytagMaskedDisplay: a***@cubid.mypaytag
                        requestedPaths:
                          - chain: base
                            network: mainnet
                            asset: USDC
                        amount:
                          value: "25.00"
                          currency: USDC
                        purpose: payout
                        payingDappReference: chaincrew:payout_987
                      - kind: answer
                        id: mpt_answer_123
                        questionId: mpt_req_123
                        createdAt: "2026-06-24T19:58:02Z"
                        status: resolved
                        selectedPayToDapp:
                          id: smartrust-wallet
                          displayName: SmarTrust Wallet
                      - kind: quote
                        id: near_1click_quote_123
                        questionId: mpt_req_123
                        createdAt: "2026-06-24T19:58:03Z"
                        provider: near_1click
                        from:
                          chain: near
                          network: mainnet
                          asset: USDC
                          amount: "25.18"
                        to:
                          chain: base
                          network: mainnet
                          asset: USDC
                          amount: "25.00"
                        fees:
                          - label: NEAR 1Click execution
                            amount: "0.16"
                            asset: USDC
                            chargedTo: sender
                            source: near_1click
                        expiresAt: "2026-06-24T20:00:00Z"
                        routeSteps:
                          - label: NEAR USDC to Base USDC
                            from:
                              chain: near
                              network: mainnet
                              asset: USDC
                              amount: "25.18"
                            to:
                              chain: base
                              network: mainnet
                              asset: USDC
                              amount: "25.00"
                        status: selected
                        selectedQuote:
                          selectedQuoteId: near_1click_quote_123
                          selectedAt: "2026-06-24T19:58:10Z"
                          payableInstructionRef: near_payable_123
                      - kind: payment_intent
                        id: mpt_pi_123
                        questionId: mpt_req_123
                        createdAt: "2026-06-24T19:58:11Z"
                        status: ready
                        payToDapp:
                          id: smartrust-wallet
                          displayName: SmarTrust Wallet
                        amount:
                          chain: base
                          network: mainnet
                          asset: USDC
                          amount: "25.00"
                        expiresAt: "2026-06-24T20:00:00Z"
                      - kind: receipt
                        id: mpt_receipt_123
                        paymentIntentId: mpt_pi_123
                        createdAt: "2026-06-24T20:01:00Z"
                        status: pending
                        chain: base
                        network: mainnet
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications:
    post:
      tags:
        - Notifications
      operationId: receiveNotificationEvent
      summary: Accept an MVP notification event payload.
      description: |
        MVP notification delivery uses Cubid comms. The only MVP event is
        payment_intent_created. Do not use payment-received language unless a
        future provider receipt callback contract exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationEvent"
            examples:
              paymentIntentCreated:
                value:
                  eventType: payment_intent_created
                  schema: mypaytag.notification.v1
                  recipient:
                    identifierType: paytag
                    maskedDisplay: r***@example.com
                  amount:
                    value: "25.00"
                    currency: USDC
                  references:
                    resolverReference: mpt_req_123
                    providerReference: provider_pi_456
                    payingDappReference: sender:payout_987
                  action:
                    type: none
      responses:
        "202":
          description: Notification accepted for delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
webhooks:
  providerPaymentIntent:
    post:
      tags:
        - Routes
      operationId: createProviderPaymentIntent
      summary: Receiving-app provider intent callback.
      description: |
        MyPayTag calls the receiving app's registered intent endpoint after the
        route has been selected. Receiving apps return a typed provider_json
        instruction for this one payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCallbackRequest"
            examples:
              providerCallback:
                value:
                  resolverRequestId: mpt_req_123
                  recipient:
                    identifierType: paytag
                    paytagReference: paytag_ref_abc
                  payingDappId: chaincrew
                  payingDappReference: chaincrew:payout_987
                  selectedPath:
                    chain: base
                    network: mainnet
                    asset: USDC
                  amount:
                    value: "25.00"
                    currency: USDC
                  purpose: payout
                  expiresAt: "2026-06-24T20:00:00Z"
      responses:
        "200":
          description: Provider intent response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderResponse"
              examples:
                providerResponse:
                  value:
                    providerIntentId: st_pi_456
                    status: ready
                    paymentInstruction:
                      type: provider_json
                      provider: smartrust-wallet
                      payload:
                        providerIntentId: st_pi_456
                        resolverReference: mpt_req_123
                        payingDappId: chaincrew
                        payingDappReference: chaincrew:payout_987
                        chain: base
                        network: mainnet
                        asset: USDC
                        destination:
                          kind: blockchain_address
                          recipientAddress: "0xabc0000000000000000000000000000000000000"
                        amount: "25.00"
                        purpose: payout
                        reference: smartrust:st_pi_456
                        expiresAt: "2026-06-24T20:00:00Z"
components:
  responses:
    BadRequest:
      description: Invalid public request shape or unsupported request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid app authentication signature.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource unavailable or not visible to the authenticated app.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Request throttled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  securitySchemes:
    MyPayTagSignature:
      type: apiKey
      in: header
      name: x-mypaytag-signature
      description: |
        App-authenticated requests include x-mypaytag-dapp-id,
        x-mypaytag-timestamp, x-mypaytag-nonce, and x-mypaytag-signature.
        The signature binds app identity, timestamp, nonce, method, path, and
        request body.
    CubidUserBearer:
      type: http
      scheme: bearer
      bearerFormat: Cubid SIWC/OIDC proof
      description: Authenticated Cubid/SIWC user proof for protected portal APIs.
  parameters:
    RouteId:
      name: routeId
      in: path
      required: true
      schema:
        type: string
        pattern: "^mpt_route_[A-Za-z0-9_-]+$"
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^mpt_act_[A-Za-z0-9_-]+$"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: mypaytag-api
    PublicStatus:
      type: string
      enum:
        - resolved
        - no_route
        - user_action_required
        - authorization_required
        - unsupported_path
        - provider_unavailable
        - provider_error
        - expired_authorization
        - revoked_authorization
        - invalid_identifier
        - invalid_request
    Recipient:
      type: object
      additionalProperties: false
      required:
        - identifierType
        - identifier
      properties:
        identifierType:
          type: string
          const: paytag
        identifier:
          type: string
          examples:
            - abd123@cubid.mypaytag
            - "+1234569999@phone.cubid.mypaytag"
    RecipientAlias:
      type: object
      additionalProperties: false
      required:
        - identifierType
        - paytagReference
      properties:
        identifierType:
          type: string
          const: paytag
        paytagReference:
          type: string
          description: MyPayTag server-side paytag reference for the selected provider callback.
    RoutePath:
      type: object
      additionalProperties: false
      required:
        - chain
        - network
        - asset
      properties:
        chain:
          type: string
          examples:
            - base
            - ethereum
            - solana
        network:
          type: string
          examples:
            - mainnet
            - sepolia
        asset:
          type: string
          examples:
            - USDC
            - USDT
    Amount:
      type: object
      additionalProperties: false
      required:
        - value
        - currency
      properties:
        value:
          type: string
          pattern: "^[0-9]+(\\.[0-9]+)?$"
        currency:
          type: string
    ResolveRequest:
      type: object
      additionalProperties: false
      required:
        - recipient
        - supportedPaths
        - amount
        - purpose
        - intentMode
        - payingDappReference
      properties:
        recipient:
          $ref: "#/components/schemas/Recipient"
        supportedPaths:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RoutePath"
        amount:
          $ref: "#/components/schemas/Amount"
        purpose:
          type: string
          minLength: 1
        intentMode:
          type: string
          const: one_time
        payingDappReference:
          type: string
          minLength: 1
        preferredSolverId:
          $ref: "#/components/schemas/SolverId"
    ResolveResponse:
      oneOf:
        - $ref: "#/components/schemas/ResolvedIntentResponse"
        - $ref: "#/components/schemas/ActionRequiredResponse"
        - type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - no_route
                - provider_unavailable
    ResolvedIntentResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - intent
      properties:
        status:
          type: string
          const: resolved
        intent:
          $ref: "#/components/schemas/MyPayTagIntent"
    ActionRequiredResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - action
      properties:
        status:
          type: string
          const: user_action_required
        action:
          $ref: "#/components/schemas/HostedAction"
    HostedAction:
      type: object
      additionalProperties: false
      required:
        - type
        - url
        - expiresAt
      properties:
        type:
          type: string
          enum:
            - route_selection
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        recipientAddress: false
        address: false
        account: false
    MyPayTagIntent:
      type: object
      additionalProperties: false
      required:
        - id
        - schema
        - status
        - modality
        - recipient
        - selectedRoute
        - amount
        - expiresAt
        - singleUse
        - paymentInstruction
        - references
      properties:
        id:
          type: string
          minLength: 1
        schema:
          type: string
          const: mypaytag.intent.v1
        status:
          type: string
          const: ready
        modality:
          type: string
          const: provider_intent
        recipient:
          $ref: "#/components/schemas/IntentRecipient"
        selectedRoute:
          $ref: "#/components/schemas/SelectedRoute"
        amount:
          $ref: "#/components/schemas/Amount"
        expiresAt:
          type: string
          format: date-time
        singleUse:
          type: boolean
          const: true
        paymentInstruction:
          $ref: "#/components/schemas/PaymentInstruction"
        references:
          $ref: "#/components/schemas/IntentReferences"
    IntentRecipient:
      type: object
      additionalProperties: false
      required:
        - identifierType
        - identifierHash
      properties:
        identifierType:
          type: string
          const: paytag
        identifierHash:
          type: string
          minLength: 1
    SelectedRoute:
      type: object
      additionalProperties: false
      required:
        - payToDappId
        - chain
        - network
        - asset
      properties:
        payToDappId:
          type: string
          minLength: 1
        chain:
          type: string
          minLength: 1
        network:
          type: string
          minLength: 1
        asset:
          type: string
          minLength: 1
    PaymentInstruction:
      type: object
      additionalProperties: false
      required:
        - type
        - provider
        - payload
      properties:
        type:
          type: string
          const: provider_json
        provider:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/ProviderPayload"
    ProviderPayload:
      type: object
      additionalProperties: true
      required:
        - providerIntentId
        - resolverReference
        - payingDappId
        - payingDappReference
        - chain
        - network
        - asset
        - destination
        - amount
        - purpose
        - reference
        - expiresAt
      properties:
        providerIntentId:
          type: string
          minLength: 1
        resolverReference:
          type: string
          minLength: 1
        payingDappId:
          type: string
          minLength: 1
        payingDappReference:
          type: string
          minLength: 1
        chain:
          type: string
          minLength: 1
        network:
          type: string
          minLength: 1
        asset:
          type: string
          minLength: 1
        destination:
          $ref: "#/components/schemas/PaymentDestination"
        amount:
          type: string
          pattern: "^[0-9]+(\\.[0-9]+)?$"
        purpose:
          type: string
          minLength: 1
        reference:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time
    PaymentDestination:
      type: object
      additionalProperties: false
      required:
        - kind
        - recipientAddress
      properties:
        kind:
          type: string
          const: blockchain_address
        recipientAddress:
          type: string
          minLength: 1
    IntentReferences:
      type: object
      additionalProperties: false
      required:
        - resolverReference
        - providerReference
        - payingDappReference
      properties:
        resolverReference:
          type: string
          minLength: 1
        providerReference:
          type: string
          minLength: 1
        payingDappReference:
          type: string
          minLength: 1
    RouteRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - recipient
        - payToDappId
        - supportedRoutes
        - authorizationToken
      properties:
        recipient:
          $ref: "#/components/schemas/Recipient"
        payToDappId:
          type: string
        supportedRoutes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RoutePath"
        authorizationToken:
          type: string
    RouteRegistrationResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - status
            - routes
          properties:
            status:
              type: string
              const: resolved
            routes:
              type: array
              items:
                $ref: "#/components/schemas/PayToRoute"
        - $ref: "#/components/schemas/ActionRequiredResponse"
        - type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - no_route
                - provider_unavailable
    PayToRoute:
      type: object
      additionalProperties: false
      required:
        - id
        - payToDappId
        - chain
        - network
        - asset
        - state
      properties:
        id:
          type: string
          minLength: 1
        payToDappId:
          type: string
          minLength: 1
        chain:
          type: string
          minLength: 1
        network:
          type: string
          minLength: 1
        asset:
          type: string
          minLength: 1
        state:
          type: string
          enum:
            - active
            - disabled
            - revoked
    RouteListResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - routes
      properties:
        status:
          type: string
          const: resolved
        routes:
          type: array
          items:
            $ref: "#/components/schemas/PayToRoute"
    RouteReadResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - status
            - route
          properties:
            status:
              type: string
              const: resolved
            route:
              $ref: "#/components/schemas/PayToRoute"
        - type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - no_route
                - provider_unavailable
    RouteUpdateRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required:
            - state
        - required:
            - supportedRoutes
      properties:
        state:
          type: string
          enum:
            - active
            - disabled
            - revoked
        supportedRoutes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RoutePath"
    RouteDeleteResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - status
            - routeId
          properties:
            status:
              type: string
              const: revoked
            routeId:
              type: string
              minLength: 1
        - type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - no_route
                - provider_unavailable
    PortalDappSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        appUrl:
          type: string
          format: uri
    PortalPreferenceDappSummary:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
    PortalAssetAmount:
      type: object
      additionalProperties: false
      required:
        - chain
        - network
        - asset
        - amount
      properties:
        chain:
          type: string
          minLength: 1
        network:
          type: string
          minLength: 1
        asset:
          type: string
          minLength: 1
        amount:
          type: string
          pattern: "^[0-9]+(\\.[0-9]+)?$"
    PortalPreferencesResponse:
      type: object
      additionalProperties: false
      required:
        - schema
        - user
        - groups
      properties:
        schema:
          type: string
          const: mypaytag.portal.preferences.v1
        user:
          type: object
          additionalProperties: false
          properties:
            maskedDisplay:
              type: string
        groups:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - paytagRef
              - chain
              - network
              - asset
              - routes
            properties:
              paytagRef:
                type: string
              maskedDisplay:
                type: string
              chain:
                type: string
              network:
                type: string
              asset:
                type: string
              payingDapp:
                $ref: "#/components/schemas/PortalPreferenceDappSummary"
              routes:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - routeId
                    - payToDappId
                    - payToDappName
                    - priority
                    - isDefault
                    - state
                  properties:
                    routeId:
                      type: string
                    payToDappId:
                      type: string
                    payToDappName:
                      type: string
                    appUrl:
                      type: string
                      format: uri
                    priority:
                      type: integer
                      minimum: 0
                    isDefault:
                      type: boolean
                    state:
                      type: string
                      enum:
                        - active
                        - disabled
                        - revoked
    PortalPreferencesUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - schema
        - group
        - orderedRouteIds
      properties:
        schema:
          type: string
          const: mypaytag.portal.preferences.update.v1
        group:
          type: object
          additionalProperties: false
          required:
            - paytagRef
            - chain
            - network
            - asset
          properties:
            paytagRef:
              type: string
            chain:
              type: string
            network:
              type: string
            asset:
              type: string
            payingDappId:
              type: string
        orderedRouteIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
    PortalHistoryResponse:
      type: object
      additionalProperties: false
      required:
        - schema
        - user
        - items
      properties:
        schema:
          type: string
          const: mypaytag.portal.history.v1
        user:
          type: object
          additionalProperties: false
          properties:
            maskedDisplay:
              type: string
        items:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/PortalQuestionSummary"
              - $ref: "#/components/schemas/PortalAnswerSummary"
              - $ref: "#/components/schemas/PortalQuoteSummary"
              - $ref: "#/components/schemas/PortalSelectedQuoteSummary"
              - $ref: "#/components/schemas/PortalPaymentIntentSummary"
              - $ref: "#/components/schemas/PortalReceiptSummary"
        nextCursor:
          type: string
    PortalQuestionSummary:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - createdAt
        - payingDapp
        - requestedPaths
        - amount
        - purpose
        - payingDappReference
      properties:
        kind:
          type: string
          const: question
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        payingDapp:
          $ref: "#/components/schemas/PortalDappSummary"
        paytagMaskedDisplay:
          type: string
        requestedPaths:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RoutePath"
        amount:
          $ref: "#/components/schemas/Amount"
        purpose:
          type: string
        payingDappReference:
          type: string
    PortalAnswerSummary:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - questionId
        - createdAt
        - status
      properties:
        kind:
          type: string
          const: answer
        id:
          type: string
        questionId:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - resolved
            - no_route
            - user_action_required
            - authorization_required
            - provider_unavailable
            - provider_error
            - invalid_identifier
            - invalid_request
        selectedPayToDapp:
          $ref: "#/components/schemas/PortalDappSummary"
        actionState:
          type: string
          enum:
            - ready
            - selected_route
            - expired
            - completed
    PortalQuoteSummary:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - questionId
        - createdAt
        - provider
        - from
        - to
        - fees
        - expiresAt
        - routeSteps
        - status
      properties:
        kind:
          type: string
          const: quote
        id:
          type: string
        questionId:
          type: string
        createdAt:
          type: string
          format: date-time
        provider:
          type: string
        from:
          $ref: "#/components/schemas/PortalAssetAmount"
        to:
          $ref: "#/components/schemas/PortalAssetAmount"
        fees:
          type: array
          items:
            $ref: "#/components/schemas/PortalQuoteFee"
        expiresAt:
          type: string
          format: date-time
        routeSteps:
          type: array
          items:
            $ref: "#/components/schemas/PortalQuoteRouteStep"
        status:
          type: string
          enum:
            - available
            - selected
            - expired
            - failed
        selectedQuote:
          $ref: "#/components/schemas/PortalSelectedQuoteLink"
    PortalQuoteFee:
      type: object
      additionalProperties: false
      required: [label, amount, asset]
      properties:
        label:
          type: string
          minLength: 1
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
        asset:
          type: string
          minLength: 1
        chargedTo:
          type: string
          enum: [sender, recipient]
        source:
          type: string
          minLength: 1
    PortalQuoteRouteStep:
      type: object
      additionalProperties: false
      required: [label]
      anyOf:
        - required: [routeReference]
        - required: [from, to]
      properties:
        label:
          type: string
          minLength: 1
        routeReference:
          type: string
          minLength: 1
        from:
          $ref: "#/components/schemas/PortalAssetAmount"
        to:
          $ref: "#/components/schemas/PortalAssetAmount"
    PortalSelectedQuoteLink:
      type: object
      additionalProperties: false
      required: [selectedQuoteId, selectedAt]
      properties:
        selectedQuoteId:
          type: string
          minLength: 1
        selectedAt:
          type: string
          format: date-time
        payableInstructionRef:
          type: string
          minLength: 1
    PortalSelectedQuoteSummary:
      type: object
      additionalProperties: false
      required: [kind, id, questionId, quoteId, selectedAt, status]
      properties:
        kind:
          const: selected_quote
          type: string
        id:
          type: string
          minLength: 1
        questionId:
          type: string
          minLength: 1
        quoteId:
          type: string
          minLength: 1
        selectedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ready, expired, failed]
        payableInstructionRef:
          type: string
          minLength: 1
    PortalPaymentIntentSummary:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - questionId
        - createdAt
        - status
        - payToDapp
        - amount
        - expiresAt
      properties:
        kind:
          type: string
          const: payment_intent
        id:
          type: string
        questionId:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - ready
            - expired
            - used
            - failed
        payToDapp:
          $ref: "#/components/schemas/PortalDappSummary"
        amount:
          $ref: "#/components/schemas/PortalAssetAmount"
        expiresAt:
          type: string
          format: date-time
    PortalReceiptSummary:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - createdAt
        - status
      anyOf:
        - required: [paymentIntentId]
          properties:
            paymentIntentId: {}
        - required: [selectedQuoteId]
          properties:
            selectedQuoteId: {}
      properties:
        kind:
          type: string
          const: receipt
        id:
          type: string
        questionId:
          type: string
          minLength: 1
        paymentIntentId:
          type: string
          minLength: 1
        selectedQuoteId:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
            - unavailable
        transactionHash:
          type: string
        chain:
          type: string
        network:
          type: string
        explorerUrl:
          type: string
          format: uri
    HostedActionView:
      type: object
      additionalProperties: false
      required:
        - status
        - actionId
        - actionType
      properties:
        status:
          type: string
          enum:
            - ready
            - expired
            - invalid
            - completed
            - replayed
            - restart_required
        actionId:
          type: string
          minLength: 1
        actionType:
          type: string
          enum:
            - route_selection
        expiresAt:
          type: string
          format: date-time
        options:
          type: array
          items:
            $ref: "#/components/schemas/RouteOption"
    RouteOption:
      type: object
      additionalProperties: false
      required:
        - optionId
        - chain
        - network
        - asset
        - payToDappId
        - displayName
      properties:
        optionId:
          type: string
          minLength: 1
        chain:
          type: string
          minLength: 1
        network:
          type: string
          minLength: 1
        asset:
          type: string
          minLength: 1
        payToDappId:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
    HostedActionDecision:
      type: object
      additionalProperties: false
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - select_route
            - leave_unchanged
            - deny
        selectedOptionId:
          type: string
          minLength: 1
    HostedActionCompletion:
      type: object
      additionalProperties: false
      required:
        - status
        - actionId
      properties:
        status:
          type: string
          enum:
            - unchanged
            - denied
            - selected_route
            - completed
            - expired
            - invalid
            - replayed
            - restart_required
        actionId:
          type: string
          minLength: 1
        selectedOptionId:
          type: string
          minLength: 1
    ProviderCallbackRequest:
      type: object
      additionalProperties: false
      required:
        - resolverRequestId
        - recipient
        - payingDappId
        - payingDappReference
        - selectedPath
        - amount
        - purpose
        - expiresAt
      properties:
        resolverRequestId:
          type: string
        recipient:
          $ref: "#/components/schemas/RecipientAlias"
        payingDappId:
          type: string
        payingDappReference:
          type: string
        selectedPath:
          $ref: "#/components/schemas/RoutePath"
        amount:
          $ref: "#/components/schemas/Amount"
        purpose:
          type: string
        expiresAt:
          type: string
          format: date-time
    ProviderResponse:
      type: object
      additionalProperties: false
      required:
        - providerIntentId
        - status
        - paymentInstruction
      properties:
        providerIntentId:
          type: string
          minLength: 1
        status:
          type: string
          const: ready
        paymentInstruction:
          $ref: "#/components/schemas/PaymentInstruction"
    NotificationEvent:
      type: object
      additionalProperties: false
      required:
        - eventType
        - schema
        - recipient
        - amount
        - references
        - action
      properties:
        eventType:
          type: string
          const: payment_intent_created
        schema:
          type: string
          const: mypaytag.notification.v1
        recipient:
          type: object
          additionalProperties: false
          required:
            - identifierType
            - maskedDisplay
          properties:
            identifierType:
              type: string
              const: paytag
            maskedDisplay:
              type: string
              minLength: 1
        amount:
          $ref: "#/components/schemas/Amount"
        references:
          type: object
          additionalProperties: false
          required:
            - resolverReference
            - providerReference
            - payingDappReference
          properties:
            resolverReference:
              type: string
              minLength: 1
            providerReference:
              type: string
              minLength: 1
            payingDappReference:
              type: string
              minLength: 1
        action:
          type: object
          additionalProperties: false
          required:
            - type
          properties:
            type:
              type: string
              const: none
    NotificationAccepted:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: accepted
    SolverId:
      type: string
      enum:
        - lifi
        - squid
        - zero_x_cross_chain
        - across
        - layerzero_stargate
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/PublicStatus"
        message:
          type: string
          description: Safe public message only.
